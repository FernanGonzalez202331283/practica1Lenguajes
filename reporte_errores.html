<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Reporte de Errores Léxicos</title><style>* {box-sizing: border-box;}body {font-family: Arial, sans-serif;background: linear-gradient(135deg, #f5eeee, #eadede);margin: 0;padding: 40px;color: #2c3e50;}.contenedor {max-width: 1100px;margin: auto;background-color: white;padding: 30px;border-radius: 12px;box-shadow: 0 5px 15px rgba(0,0,0,0.12);}h1 {text-align: center;margin-top: 0;margin-bottom: 10px;color: #922b21;font-size: 28px;}.descripcion {text-align: center;color: #7f8c8d;margin-bottom: 25px;}table {width: 100%;border-collapse: collapse;overflow: hidden;border-radius: 8px;}th {background: linear-gradient(135deg, #c0392b, #922b21);color: white;padding: 13px;text-align: center;font-size: 15px;}td {padding: 11px;border-bottom: 1px solid #e0e0e0;text-align: center;}tr:nth-child(even) {background-color: #fdf2f2;}tr:hover {background-color: #fbe9e7;transition: 0.2s;}td:nth-child(2) {font-weight: bold;color: #922b21;}.pie {margin-top: 20px;text-align: right;font-size: 13px;color: #7f8c8d;}.sin-errores {background-color: #eafaf1;color: #27ae60;border: 1px solid #a9dfbf;padding: 15px;border-radius: 8px;text-align: center;font-weight: bold;}</style></head><body><h1>Reporte de Errores Léxicos</h1><table><tr><th>No.</th><th>Lexema</th><th>Tipo de error</th><th>Fila</th><th>Columna</th></tr><tr><td>1</td><td>$</td><td>Carácter no reconocido</td><td>4</td><td>1</td></tr><tr><td>2</td><td>-</td><td>Operador o conector no reconocido</td><td>5</td><td>29</td></tr></table></body></html>
